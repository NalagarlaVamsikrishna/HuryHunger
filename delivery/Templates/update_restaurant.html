<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Restaurant | HuryHungr</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'update_restaurant.css' %}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="brand">🍽️ HuryHungr</div>
        <div class="nav-links">
            <a href="{% url 'open_show_restaurant' %}">Restaurants</a>
            <a href="{% url 'open_add_restaurant' %}">Add Restaurant</a>
        </div>
    </nav>
    <!-- Main -->
    <main class="page-container">
        <div class="page-header">
            <span class="eyebrow">ADMIN PANEL</span>
            <h1>Update Restaurant</h1>
            <p>Modify the restaurant information below.</p>
        </div>
        <div class="form-card">
            <div class="restaurant-title">
                <div class="restaurant-icon">🍽️</div>
                <div>
                    <h2>{{ restaurant.name }}</h2>
                    <span>Restaurant Information</span>
                </div>
            </div>
            <form
                action="{% url 'update_restaurant' restaurant.id %}"
                method="POST"
            >
                {% csrf_token %}
                <div class="form-group">
                    <label for="name">Restaurant Name</label>
                    <input
                        type="text"
                        name="name"
                        id="name"
                        value="{{ restaurant.name }}"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="picture">Picture URL</label>
                    <input
                        type="url"
                        name="picture"
                        id="picture"
                        value="{{ restaurant.picture }}"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="cuisine">Cuisine</label>
                    <input
                        type="text"
                        name="cuisine"
                        id="cuisine"
                        value="{{ restaurant.cuisine }}"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="rating">Rating</label>
                    <input
                        type="number"
                        name="rating"
                        id="rating"
                        min="0"
                        max="5"
                        step="0.5"
                        value="{{ restaurant.rating }}"
                        required
                    >
                    <small>Rating should be between 0 and 5.</small>
                </div>
                <div class="form-actions">
                    <a href="{% url 'open_show_restaurant' %}" class="cancel-btn">
                        Cancel
                    </a>
                    <button type="submit" class="update-btn">
                        Update Restaurant
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
