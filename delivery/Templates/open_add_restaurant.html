<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Add Restaurant</title>
</head>
<body>
    <form action="{% url 'add_restaurant' %}" method="POST">
        {% csrf_token %}
        <label for="name">Name: </label>
        <input type="text" name="name" id="name"> <br>

        <label for="picture">Picture url: </label>
        <input type="url" name="picture" id="picture"> <br>

        <label for="cuisine">Cuisine: </label>
        <input type="text" name="cuisine" id="cuisine"> <br>

        <label for="rating">Rating: </label>
        <input type="number" name="rating" id="rating" step="0.5"> <br>

        <button type="submit">Add Restaurant</button>
    </form>

</body>
</html>
