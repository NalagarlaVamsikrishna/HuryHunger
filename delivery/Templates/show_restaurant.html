<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Restaurant</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Picture</th>
                <th>Cuisine</th>
                <th>Rating</th>
                <th>Operation</th>
            </tr>
        </thead>

        <tbody>
            {% for r in restaurantList %}
            <tr>
                <td>{{ r.name }}</td>
                <td>
                    <img src="{{ r.picture }}">
                </td>
                <td>{{ r.cuisine }}</td>
                <td>{{ r.rating }}</td>
                <td>
                    <a href="#">
                        Updated Restaurant Info
                    </a> 
                    <br>
                    <a href="#">
                        Delete Restaurant
                    </a> 
                    <br>
                    <a href="#">
                        Update Menu
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    
</body>
</html>
