<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Page</title>
</head>
<body>
    <h1>Welcome {{username}} something waiting for you</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Picture</th>
                <th>Restaurant Name</th>
                <th>Cuisine</th>
                <th>Rating</th>
                <th>Operation</th>
            </tr>
        </thead>
        <tbody>
            {% for r in restaurantList %}
            <tr>
                <td>
                    <img src="{{ r.picture }}" style="width: 300px; height: 200px; object-fit: fill;">
                </td>
                <td>{{ r.name }}</td>
                <td>{{ r.cuisine }}</td>
                <td>{{ r.rating }}</td>
                <td>
                    <a href="{% url 'view_menu' r.id username %}">
                        View Menu
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
